<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Unlimited VPN</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; direction: ltr; }

        .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 15px; align-items: center; }

        /* ہیڈر */
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 0; direction: rtl; }
        .logo-area { display: flex; align-items: center; gap: 8px; }
        .logo-icon { background: var(--primary); color: white; width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .logo-text h2 { font-size: 18px; color: #fff; font-weight: 800; text-align: right; }
        .logo-text p { font-size: 11px; color: #94a3b8; }
        .status-badge { background: #334155; color: #cbd5e1; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }

        /* وی پی این مین کنٹرول باکس اور گول دائرہ */
        .vpn-container { width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 35px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        
        .connect-circle { width: 160px; height: 160px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #1d4ed8); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 30px rgba(59, 130, 246, 0.4); transition: all 0.3s ease; text-align: center; border: 4px solid rgba(255,255,255,0.1); }
        .connect-circle.connected { background: linear-gradient(135deg, #10b981, #047857); box-shadow: 0 0 30px rgba(16, 185, 129, 0.4); }
        
        .circle-icon { font-size: 32px; margin-bottom: 5px; }
        .circle-text { font-size: 16px; font-weight: bold; color: white; }

        .connection-status { font-size: 13px; color: #94a3b8; font-weight: 600; text-align: center; }

        /* ایڈ / ویڈیو پاپ اپ موڈل */
        .ad-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .ad-box { width: 100%; max-width: 380px; background: var(--card-bg); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 15px; border: 1px solid var(--border-color); text-align: center; }
        .ad-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #94a3b8; }
        .ad-timer { background: #ef4444; color: white; padding: 2px 8px; border-radius: 6px; font-weight: bold; }
        .ad-banner-img { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; background: #000; }
        .ad-title { font-size: 16px; font-weight: bold; color: #fff; }
        .ad-desc { font-size: 12px; color: #94a3b8; }

        /* نیچے والے چھوٹے چھوٹے ایڈز (متعدد بینرز) */
        .ads-section { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .small-ad { width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; text-align: left; direction: ltr; }
        .small-ad img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
        .small-ad-info { flex: 1; }
        .small-ad-title { font-size: 12px; font-weight: bold; color: #fff; }
        .small-ad-desc { font-size: 10px; color: #94a3b8; }
        .small-ad-btn { background: var(--primary); color: white; border: none; padding: 4px 10px; border-radius: 5px; font-size: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ہیڈر -->
        <div class="header">
            <div class="logo-area">
                <div class="logo-icon">🛡️</div>
                <div class="logo-text">
                    <h2>Turbo VPN</h2>
                    <p>Unlimited Free</p>
                </div>
            </div>
            <div class="status-badge" id="topStatus">مفت سرور</div>
        </div>

        <!-- وی پی این مین کنٹرول باکس (گول دائرہ) -->
        <div class="vpn-container">
            <div class="connect-circle" id="connectCircle" onclick="handleVpnClick()">
                <div class="circle-icon" id="circleIcon">🔌</div>
                <div class="circle-text" id="circleText">Connect</div>
            </div>
            <div class="connection-status" id="statusText">کنیکٹ کرنے کے لیے دائرے پر کلک کریں</div>
        </div>

        <!-- نیچے چھوٹے چھوٹے ایڈز کی فہرست -->
        <div class="ads-section">
            <div class="small-ad">
                <img src="https://images.unsplash.com/photo-1557804506-669a67965ba0?w=100" alt="Ad">
                <div class="small-ad-info">
                    <div class="small-ad-title">Star Realm Dash</div>
                    <div class="small-ad-desc">بہترین گیم اور انعامات</div>
                </div>
                <button class="small-ad-btn" onclick="alert('اشتہار کھولا گیا!')">Install</button>
            </div>

            <div class="small-ad">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100" alt="Ad">
                <div class="small-ad-info">
                    <div class="small-ad-title">Super VPN Proxy</div>
                    <div class="small-ad-desc">لامحدود تیز رفتار انٹرنیٹ</div>
                </div>
                <button class="small-ad-btn" onclick="alert('اشتہار کھولا گیا!')">Open</button>
            </div>
        </div>
    </div>

    <!-- ایڈ والا پاپ اپ موڈل (کنیکٹ اور ڈس کنیکٹ دونوں پر چلے گا) -->
    <div class="ad-modal" id="adModal">
        <div class="ad-box">
            <div class="ad-header">
                <span id="adModalHeading">اشتہار چل رہا ہے...</span>
                <span class="ad-timer" id="adTimer">4s</span>
            </div>
            <img src="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=400" class="ad-banner-img" alt="Ad">
            <div class="ad-title">اسپانسرڈ اشتہار</div>
            <div class="ad-desc" id="adModalDesc">براہ کرم عمل مکمل ہونے تک انتظار کریں...</div>
        </div>
    </div>

<script>
    let isConnected = false;

    function handleVpnClick() {
        const modal = document.getElementById('adModal');
        const timerEl = document.getElementById('adTimer');
        const headingEl = document.getElementById('adModalHeading');
        const descEl = document.getElementById('adModalDesc');

        modal.style.display = 'flex';
        let timeLeft = 4; // 4 سیکنڈ کا ایڈ ٹائمر
        timerEl.innerText = timeLeft + 's';

        if (!isConnected) {
            headingEl.innerText = "کنیکٹنگ ایڈ چل رہا ہے...";
            descEl.innerText = "وی پی این کنیکٹ ہونے کے لیے اشتہار پورا دیکھیں...";
        } else {
            headingEl.innerText = "ڈس کنیکٹنگ ایڈ چل رہا ہے...";
            descEl.innerText = "وی پی این بند ہونے کے لیے اشتہار پورا دیکھیں...";
        }

        let countdown = setInterval(() => {
            timeLeft--;
            timerEl.innerText = timeLeft + 's';

            if (timeLeft <= 0) {
                clearInterval(countdown);
                modal.style.display = 'none'; // ایڈ ختم

                if (!isConnected) {
                    // اب وی پی این ان لمیٹڈ کنیکٹ ہو گیا
                    isConnected = true;
                    document.getElementById('connectCircle').classList.add('connected');
                    document.getElementById('circleIcon').innerHTML = "🔒";
                    document.getElementById('circleText').innerHTML = "Disconnect";
                    document.getElementById('statusText').innerText = "وی پی این ان لمیٹڈ جڑ چکا ہے! ✅";
                    document.getElementById('topStatus').innerText = "محفوظ (Secure)";
                } else {
                    // اب وی پی این ڈس کنیکٹ ہو گیا
                    isConnected = false;
                    document.getElementById('connectCircle').classList.remove('connected');
                    document.getElementById('circleIcon').innerHTML = "🔌";
                    document.getElementById('circleText').innerHTML = "Connect";
                    document.getElementById('statusText').innerText = "وی پی این کامیابی سے بند کر دیا گیا ہے۔";
                    document.getElementById('topStatus').innerText = "مفت سرور";
                }
            }
        }, 1000);
    }
</script>

</body>
</html>
