                    
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="google-adsense-account" content="ca-pub-3418695563807315">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لائیو سٹریم اور چینل مینیجر</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
            --navbar-bg: linear-gradient(135deg, #4f46e5, #7c3aed);
            --sidebar-bg: #1e1b4b;
            --card-bg: #ffffff;
            --section-bg-1: #fdf4ff; /* ہلکا پنک */
            --section-bg-2: #ecfdf5; /* ہلکا سبز */
            --section-bg-3: #eff6ff; /* ہلکا نیلا */
            --text-color: #0f172a;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            min-height: 100vh;
        }

        /* ٹاپ نیویگیشن بار - تیز رنگ */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--navbar-bg);
            padding: 15px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid rgba(255,255,255,0.2);
        }

        .menu-icon {
            font-size: 26px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #ffffff;
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        .app-title {
            font-size: 19px;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .balance-info {
            font-size: 13px;
            font-weight: bold;
            background: #f59e0b;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
        }

        /* سلائیڈ سائیڈ مینیو - الگ ڈارک کلر */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1000;
            top: 0;
            right: 0;
            background: var(--sidebar-bg);
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            border-left: 2px solid #4f46e5;
        }

        .sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 16px;
            color: #e2e8f0;
            display: block;
            transition: 0.2s;
            font-weight: 600;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar a:hover {
            background-color: #4f46e5;
            color: #ffffff;
            padding-right: 30px;
        }

        .sidebar .close-btn {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 22px;
            cursor: pointer;
            background: #ef4444;
            border: none;
            color: #ffffff;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-weight: bold;
        }

        /* مین کنٹینر */
        .container {
            width: 90%;
            max-width: 500px;
            margin: 30px auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 3px solid #6366f1;
        }

        /* ہر سیکشن کا اپنا الگ خوبصورت رنگ */
        .section-1 {
            background: var(--section-bg-3);
            border: 2px solid #3b82f6;
        }

        .section-2 {
            background: var(--section-bg-2);
            border: 2px solid #10b981;
        }

        .section-3 {
            background: var(--section-bg-1);
            border: 2px solid #ec4899;
        }

        .section {
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #1e293b;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            background: #ffffff;
            color: #333;
            font-weight: 600;
        }

        input:focus, select:focus {
            border-color: #6366f1;
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        /* تیز اور شاندار گرین و ब्लू بٹنز */
        button.action-btn {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3);
            transition: 0.2s;
        }

        button.action-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .search-btn {
            background: linear-gradient(135deg, #2563eb, #3b82f6) !important;
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.3) !important;
        }

        .ad-btn {
            background: linear-gradient(135deg, #db2777, #f43f5e) !important;
            box-shadow: 0 6px 15px rgba(244, 63, 94, 0.35) !important;
        }

        .status-text {
            font-weight: bold;
            color: #047857;
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            background: #ffffff;
            padding: 10px;
            border-radius: 10px;
            border: 2px dashed #10b981;
        }
    </style>
</head>
<body>

    <!-- ٹاپ بار -->
    <div class="navbar">
        <button class="menu-icon" onclick="toggleMenu()">☰</button>
        <h1 class="app-title">لائیو سٹریم مینیجر</h1>
        <div class="balance-info">🪙 <span id="navCoins">0</span> کوائنز</div>
    </div>

    <!-- سلائیڈ سائیڈ مینیو -->
    <div id="mySidebar" class="sidebar">
        <button class="close-btn" onclick="toggleMenu()">✕</button>
        <div style="text-align: center; padding: 25px 15px; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <h3 style="margin: 0; color: #ffffff;" id="menuUserName">مہمان صارف</h3>
            <p style="margin: 8px 0 0 0; font-size: 12px; color: #94a3b8;" id="menuUserEmail">آن لائن اکاؤنٹ</p>
        </div>
        <a href="#" onclick="loginWithGoogle()">🔐 گوگل (Gmail) سے لاگ ان کریں</a>
        <a href="#" onclick="logoutUser()">🚪 لاگ آؤٹ کریں</a>
        <a href="#" onclick="alert('آپ کے کل کوائنز: ' + (localStorage.getItem('userCoins') || 0))">💰 بیلنس چیک کریں</a>
    </div>

    <!-- مین کارڈ -->
    <div class="container">
        <!-- چینل سرچ سیکشن (نیلا رنگ) -->
        <div class="section section-1">
            <label>🔍 اپنا چینل تلاش کریں</label>
            <select id="platformSelect">
                <option value="youtube">یوٹیوب (YouTube)</option>
                <option value="tiktok">ٹک ٹاک (TikTok)</option>
            </select>
            <input type="text" id="channelInput" placeholder="چینل کا نام یا پروفائل لنک لکھیں">
            <button class="action-btn search-btn" onclick="searchChannel()">چینل تلاش کریں</button>
        </div>

        <!-- کوائنز اور پیمنٹ سیکشن (سبز رنگ) -->
        <div class="section section-2">
            <label>💳 کوائنز حاصل کریں (پیمنٹ تصدیق)</label>
            <select id="paymentSelect">
                <option value="easypaisa">ایزی پیسا (EasyPaisa)</option>
                <option value="jazzcash">جاز کیش (JazzCash)</option>
                <option value="meezan">میزان بینک (Meezan Bank)</option>
            </select>
            <input type="text" id="tidInput" placeholder="ٹرانزیکشن کی آئی ڈی (TID) یا نمبر درج کریں">
            <button class="action-btn" onclick="submitPayment()">100 روپے جمع کریں (50 کوائنز)</button>
        </div>

        <!-- فری لائیو سٹریم ٹائم (پنک رنگ) -->
        <div class="section section-3">
            <label>⏱️ فری لائیو سٹریم ٹائم</label>
            <p style="font-size: 12px; color: #475569; margin-top: 0; margin-bottom: 12px; font-weight: 600;">اشتہار دیکھ کر فری منٹس حاصل کریں:</p>
            <button class="action-btn ad-btn" onclick="watchAd()">30 سیکنڈ کا ایڈ دیکھیں</button>
            <div class="status-text" id="statusDisplay">دیکھے گئے ایڈز: 0 | فری ٹائم: 0 منٹ</div>
        </div>
    </div>

    <script>
        function toggleMenu() {
            let sidebar = document.getElementById("mySidebar");
            if (sidebar.style.width === "260px") {
                sidebar.style.width = "0";
            } else {
                sidebar.style.width = "260px";
            }
        }

        window.onload = function() {
            refreshData();
        };

        function refreshData() {
            let savedAds = localStorage.getItem('watchedAds') || 0;
            let savedMinutes = localStorage.getItem('freeMinutes') || 0;
            let savedCoins = localStorage.getItem('userCoins') || 0;
            let savedUser = localStorage.getItem('userName');

            document.getElementById('navCoins').innerText = savedCoins;
            document.getElementById('statusDisplay').innerText = "دیکھے گئے ایڈز: " + savedAds + " | فری ٹائم: " + savedMinutes + " منٹ";

            if(savedUser) {
                document.getElementById('menuUserName').innerText = savedUser;
            }
        }

        function loginWithGoogle() {
            let name = prompt("اپنا نام یا جی میل درج کریں:");
            if(name && name.trim() !== "") {
                localStorage.setItem('userName', name);
                refreshData();
                alert("کامیابی سے لاگ ان ہو گئے!");
                toggleMenu();
            }
        }

        function logoutUser() {
            localStorage.removeItem('userName');
            document.getElementById('menuUserName').innerText = "مہمان صارف";
            refreshData();
            alert("لاگ آؤٹ ہو گئے!");
            toggleMenu();
        }

        function searchChannel() {
            let val = document.getElementById('channelInput').value;
            if(val.trim() === "") {
                alert("براہ کرم چینل کا نام یا لنک لکھیں!");
            } else {
                alert("چینل کی معلومات تلاش کی جا رہی ہیں: " + val);
            }
        }

        function submitPayment() {
            let tid = document.getElementById('tidInput').value;
            if(tid.trim() === "") {
                alert("براہ کرم ٹرانزیکشن آئی ڈی (TID) یا نمبر درج کریں!");
                return;
            }

            let currentCoins = parseInt(localStorage.getItem('userCoins') || 0);
            currentCoins += 50;
            localStorage.setItem('userCoins', currentCoins);

            refreshData();
            alert("پیمنٹ موصول ہو گئی! 50 کوائنز شامل کر دیے گئے ہیں۔");
            document.getElementById('tidInput').value = "";
        }

        function watchAd() {
            let ads = parseInt(localStorage.getItem('watchedAds') || 0);
            let minutes = parseInt(localStorage.getItem('freeMinutes') || 0);

            ads += 1;
            minutes += 15;

            localStorage.setItem('watchedAds', ads);
            localStorage.setItem('freeMinutes', minutes);

            refreshData();
            alert("ایڈ مکمل ہو گیا! 15 منٹ فری ٹائم مل گیا۔");
        }
    </script>
</body>
</html>
