<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Auto Caption & Emoji Studio</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --text-main: #f8fafc;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; direction: rtl; text-align: center; }

        .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 12px; }
        
        h1 { font-size: 18px; font-weight: 700; color: #fff; }
        p.sub-text { font-size: 13px; color: #94a3b8; }

        /* ویڈیو اور کینوس باکس */
        .video-box { width: 100%; height: 200px; background: #000; border-radius: 10px; overflow: hidden; position: relative; border: 2px solid var(--border-color); display: flex; align-items: center; justify-content: center; }
        video, canvas { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        .placeholder-text { color: #64748b; font-size: 14px; z-index: 5; }

        /* کیپشن ایڈیٹر سیکشن (جہاں نیچے الفاظ ایڈٹ ہوں گے) */
        .editor-section { background: #1e293b; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; display: none; text-align: right; }
        .editor-section h3 { font-size: 13px; color: #facc15; margin-bottom: 6px; }
        .caption-textarea { width: 100%; height: 60px; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 6px; padding: 8px; font-size: 14px; resize: none; direction: rtl; }
        .btn-update { background: #f59e0b; color: #000; border: none; padding: 6px 12px; border-radius: 5px; font-size: 12px; font-weight: bold; cursor: pointer; margin-top: 6px; width: 100%; }

        /* --- اشتہار (Ad Banner) جو بالکل بیچ میں ہے --- */
        .ad-container { width: 100%; background: #1e293b; border: 1px solid var(--border-color); border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); overflow: hidden; text-align: right; }
        .ad-header { display: flex; justify-content: space-between; align-items: center; padding: 4px 10px; background: #0f172a; border-bottom: 1px solid var(--border-color); }
        .ad-badge { background: #f59e0b; color: #000; font-size: 8px; font-weight: bold; padding: 2px 5px; border-radius: 3px; }
        .ad-body { display: flex; gap: 10px; padding: 8px; align-items: center; }
        .ad-thumb { width: 70px; height: 45px; object-fit: cover; border-radius: 5px; background: #334155; }
        .ad-info { flex: 1; }
        .ad-title { font-size: 11px; font-weight: 700; color: #fff; margin-bottom: 2px; }
        .ad-desc { font-size: 9px; color: #94a3b8; line-height: 1.2; margin-bottom: 4px; }
        .ad-cta { background: #10b981; color: white; border: none; padding: 3px 8px; border-radius: 3px; font-size: 9px; font-weight: 600; cursor: pointer; float: left; }

        /* بٹنز */
        .btn { display: block; width: 100%; background: #10b981; color: white; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #059669; }
        
        .btn-download { background: #3b82f6; display: none; }
        .btn-download:hover { background: #2563eb; }

        #videoInput { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ AI Video Auto Caption & Emoji</h1>
        <p class="sub-text" id="statusMsg">ویڈیو سلیکٹ کریں اور کیپشن ایڈٹ یا سیو کریں</p>

        <!-- ویڈیو اور کینوس باکس -->
        <div class="video-box" id="videoBox">
            <span class="placeholder-text" id="placeholderText">کوئی ویڈیو منتخب نہیں کی گئی 🎬</span>
            <video id="mainVideo" crossorigin="anonymous" playsinline style="display:none;"></video>
            <canvas id="outputCanvas" style="display:none;"></canvas>
        </div>

        <!-- 📝 کیپشن ایڈیٹر باکس (یہاں آپ الفاظ درست کر سکیں گے) -->
        <div class="editor-section" id="editorSection">
            <h3>✏️ آٹو کیپشن اور ایموجی ایڈیٹر (یہاں درست کریں):</h3>
            <textarea class="caption-textarea" id="captionInputText">یا مدینہ سب کا سہارا مدینہ 🕌 ✨</textarea>
            <button class="btn-update" onclick="updateCaptionText()">تبدیلیاں محفوظ کریں (Update)</button>
        </div>

        <!-- 🌟 اشتہار (Ad Banner) جو بالکل بیچ میں موجود ہے -->
        <div class="ad-container">
            <div class="ad-header">
                <span style="font-size: 8px; color: #94a3b8;">Sponsored Advertisement</span>
                <span class="ad-badge">AD</span>
            </div>
            <div class="ad-body">
                <img src="https://images.unsplash.com/photo-1557804506-669a67965ba0?w=300" class="ad-thumb" alt="Ad">
                <div class="ad-info">
                    <div class="ad-title">Exclusive Offer</div>
                    <div class="ad-desc">Discover amazing products and services today.</div>
                    <button class="ad-cta" onclick="alert('اشتہار پر کلک کرنے کا شکریہ!')">Install Now</button>
                </div>
            </div>
        </div>

        <input type="file" id="videoInput" accept="video/*" onchange="handleVideoUpload(event)">

        <!-- کنٹرول بٹنز -->
        <button class="btn" onclick="document.getElementById('videoInput').click()">📁 ویڈیو سلیکٹ کریں</button>
        <button class="btn btn-download" id="downloadBtn" onclick="downloadCaptionedVideo()">⬇️ کیپشن والی ویڈیو سیو (Download) کریں</button>
    </div>

<script>
    let videoElement = document.getElementById('mainVideo');
    let canvas = document.getElementById('outputCanvas');
    let ctx = canvas.getContext('2d');
    let mediaRecorder;
    let recordedChunks = [];
    let isProcessing = false;
    let currentCaption = "یا مدینہ سب کا سہارا مدینہ 🕌 ✨";

    function handleVideoUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const placeholder = document.getElementById('placeholderText');
            videoElement.src = URL.createObjectURL(file);
            videoElement.style.display = 'block';
            canvas.style.display = 'block';
            placeholder.style.display = 'none';
            document.getElementById('editorSection').style.display = 'block';

            videoElement.onloadedmetadata = function() {
                canvas.width = videoElement.videoWidth || 640;
                canvas.height = videoElement.videoHeight || 360;
                
                document.getElementById('statusMsg').innerText = "آٹو کیپشن جنریٹ ہو گئے ہیں، نیچے سے ایڈٹ کر سکتے ہیں ✨";
                videoElement.play();
                startDrawingAndRecording();
            };
        }
    }

    function updateCaptionText() {
        const userText = document.getElementById('captionInputText').value;
        currentCaption = userText;
        document.getElementById('statusMsg').innerText = "کیپشن اپ ڈیٹ ہو گئے ہیں ✅";
    }

    function startDrawingAndRecording() {
        if (isProcessing) return;
        isProcessing = true;
        document.getElementById('downloadBtn').style.display = 'block';

        const stream = canvas.captureStream(30);
        recordedChunks = [];
        try {
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        } catch (e) {
            mediaRecorder = new MediaRecorder(stream);
        }

        mediaRecorder.ondataavailable = function(event) {
            if (event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        };
        mediaRecorder.start();

        function drawFrame() {
            if (!videoElement.paused && !videoElement.ended) {
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                
                // --- سکرین پر کیپشن اور ایموجی کی ڈیزائننگ ---
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(20, canvas.height - 75, canvas.width - 40, 50);
                
                ctx.strokeStyle = "#eab308";
                ctx.lineWidth = 2;
                ctx.strokeRect(20, canvas.height - 75, canvas.width - 40, 50);

                ctx.fillStyle = "#facc15";
                ctx.font = "bold 16px 'Segoe UI', Tahoma, sans-serif";
                ctx.textAlign = "center";
                
                ctx.fillText(currentCaption, canvas.width / 2, canvas.height - 45);

                requestAnimationFrame(drawFrame);
            } else if (!videoElement.ended) {
                requestAnimationFrame(drawFrame);
            }
        }
        drawFrame();
    }

    function downloadCaptionedVideo() {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
        }
        document.getElementById('statusMsg').innerText = "فائل تیار ہو رہی ہے، ڈاؤن لوڈ شروع ہو رہا ہے... 📥";

        setTimeout(() => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'AI-Auto-Captioned-Video.webm';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.getElementById('statusMsg').innerText = "ویڈیو کامیابی سے سیو ہو گئی! ✅";
        }, 1500);
    }
</script>

</body>
</html>
