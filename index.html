        .
    </div>

    <script>
        window.onload = function() {
            let loggedUser = localStorage.getItem('googleUserEmail');
            if(loggedUser) {
                showDashboard(loggedUser);
            }

            let savedCh = localStorage.getItem('savedChannelLink');
            if(savedCh) {
                document.getElementById('savedChannelDisplay').innerHTML = "<b>Saved Channel:</b> <a href='" + savedCh + "' target='_blank' style='color: #2563eb;'>" + savedCh + "</a>";
            }
        };

        function simulateGoogleLogin() {
            let email = prompt("Enter your Gmail account to sign in:", "user@gmail.com");
            if(email && email.includes("@")) {
                localStorage.setItem('googleUserEmail', email);
                showDashboard(email);
                alert("Successfully logged in with " + email);
            } else {
                alert("Please enter a valid Gmail address.");
            }
        }

        function showDashboard(email) {
            document.getElementById('loginSection').style.display = "none";
            document.getElementById('dashboardSection').style.display = "block";
            document.getElementById('sidebarUserEmail').innerText = email;
            let namePart = email.split('@')[0];
            document.getElementById('sidebarUserName').innerText = namePart.charAt(0).toUpperCase() + namePart.slice(1);
        }

        function handleLogout() {
            localStorage.removeItem('googleUserEmail');
            location.reload();
        }

        function saveChannelLink() {
            let val = document.getElementById('channelInput').value.trim();
            if(!val) {
                alert("Please enter a channel link!");
                return;
            }
            localStorage.setItem('savedChannelLink', val);
            document.getElementById('savedChannelDisplay').innerHTML = "<b>Saved Channel:</b> <a href='" + val + "' target='_blank' style='color: #2563eb;'>" + val + "</a>";
            document.getElementById('channelInput').value = "";
            alert("Channel saved successfully!");
        }

        function startLiveStreamSession() {
            let val = document.getElementById('videoLinkInput').value.trim();
            if(!val) {
                alert("Please enter a YouTube video link or ID!");
                return;
            }
            
            let videoId = val;
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = val.match(regExp);
            if (match && match[2].length === 11) {
                videoId = match[2];
            }

            let currentDomain = window.location.hostname || "localhost";
            
            // یوٹیوب ویڈیو کو لائیو موڈ اور لائیو چیٹ کے ساتھ فورس کرنا
            document.getElementById('ytIframe').src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1&live=1&controls=1&modestbranding=1";
            document.getElementById('ytChatIframe').src = "https://www.youtube.com/live_chat?v=" + videoId + "&embed_domain=" + currentDomain;
            
            document.getElementById('liveWrapperBox').style.display = "block";
            document.getElementById('videoLinkInput').value = "";
            alert("Live Stream & Live Chat started successfully!");
        }
    </script>
</body>
</html>
