here<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Manager</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
            --navbar-bg: linear-gradient(135deg, #4f46e5, #7c3aed);
            --sidebar-bg: #1e1b4b;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--navbar-bg);
            padding: 15px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid rgba(255,255,255,0.2);
        }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #ffffff;
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        .app-title {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .plan-badge {
            font-size: 12px;
            font-weight: bold;
            background: #ef4444;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            background: var(--sidebar-bg);
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }

        .sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 15px;
            color: #e2e8f0;
            display: block;
            font-weight: 600;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 20px;
            cursor: pointer;
            background: #ef4444;
            border: none;
            color: #ffffff;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 550px;
            margin: 30px auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 3px solid #6366f1;
        }

        .section {
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .section-login { background: #f8fafc; border: 2px solid #64748b; text-align: center; }
        .section-1 { background: #eff6ff; border: 2px solid #3b82f6; }
        .section-2 { background: #fff7ed; border: 2px solid #f97316; }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 13px;
            color: #1e293b;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            margin-top: 4px;
            margin-bottom: 12px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            background: #ffffff;
            color: #333;
            font-weight: 600;
        }

        button.action-btn {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3);
        }

        .google-login-btn {
            background: #ffffff !important;
            color: #334155 !important;
            border: 2px solid #cbd5e1 !important;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: bold;
        }

        .search-btn { background: linear-gradient(135deg, #2563eb, #3b82f6) !important; }
        .video-btn { background: linear-gradient(135deg, #ea580c, #f97316) !important; }

        .live-wrapper {
            display: none;
            margin-top: 15px;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%;
            border-radius: 12px 12px 0 0;
            overflow: hidden;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .chat-container {
            width: 100%;
            height: 250px;
            border: 2px solid #f97316;
            border-top: none;
            border-radius: 0 0 12px 12px;
            background: #ffffff;
        }

        .chat-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .saved-box {
            background: #ffffff;
            border: 2px solid #3b82f6;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 12px;
            font-weight: bold;
            color: #1e3a8a;
            word-break: break-all;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <button class="menu-icon" onclick="document.getElementById('mySidebar').style.width = '280px'">☰</button>
        <h1 class="app-title">Live Stream Manager</h1>
        <div class="plan-badge">🔴 LIVE STREAM</div>
    </div>

    <div id="mySidebar" class="sidebar">
        <button class="close-btn" onclick="document.getElementById('mySidebar').style.width = '0'">✕</button>
        <div style="text-align: center; padding: 25px 15px; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <h3 style="margin: 0; color: #ffffff;" id="sidebarUserName">Stream Manager</h3>
            <p style="margin: 8px 0 0 0; font-size: 12px; color: #94a3b8;" id="sidebarUserEmail">Not Logged In</p>
        </div>
        <a href="#" onclick="handleLogout()">🚪 Logout / Switch Account</a>
    </div>

    <div class="container">
        
        <!-- Google Login Section -->
        <div class="section section-login" id="loginSection">
            <label style="font-size: 15px; color: #0f172a; margin-bottom: 10px;">🔐 Google Login Required</label>
            <p style="font-size: 12px; color: #64748b; margin-top: 0; margin-bottom: 15px;">Login with your Gmail to start live streaming and chat broadcast.</p>
            <button class="action-btn google-login-btn" onclick="simulateGoogleLogin()">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.17 21.36 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.39-1.49-.39-2.24s.14-1.52.39-2.24V6.6H1.19C.43 8.15 0 9.92 0 11.8s.43 3.65 1.19 5.2l4.08-2.76z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.64 1.19 6.6l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                Sign in with Google
            </button>
        </div>

        <!-- Main Stream Manager Panel -->
        <div id="dashboardSection" style="display: none;">
            
            <!-- Step 1 -->
            <div class="section section-1">
                <label>📌 Step 1: Save Your YouTube Channel</label>
                <input type="text" id="channelInput" placeholder="Enter channel link (e.g. https://youtube.com/@...)">
                <button class="action-btn search-btn" onclick="saveChannelLink()">Save Channel</button>
                <div class="saved-box" id="savedChannelDisplay">No Channel Saved Yet</div>
            </div>

            <!-- Step 2 -->
            <div class="section section-2">
                <label>🔴 Step 2: Add Video Link to Stream Live</label>
                <input type="text" id="videoLinkInput" placeholder="Enter YouTube Video Link or ID">
                <button class="action-btn video-btn" onclick="startLiveStreamSession()">Start Live Stream & Chat</button>
                
                <div class="live-wrapper" id="liveWrapperBox">
                    <div class="video-container">
                        <iframe id="ytIframe" src="" allowfullscreen></iframe>
                    </div>
                    <div class="chat-container">
                        <iframe id="ytChatIframe" src=""></iframe>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        window.onload = function() {
            let loggedUser = localStorage.getItem('googleUserEmail');
            if(loggedUser) {
                showDashboard(loggedUser);
            }

            let savedCh = localStorage.getItem('savedChannelLink');
            if(savedCh) {
                document.getElementById('savedChannelDisplay').innerHTML = "<b>Saved Channel:</b> <a href='" + savedCh + "' target='_blank' style='color: #2563eb;'>" + savedCh + "</a>";
            }
        };

        function simulateGoogleLogin() {
            let email = prompt("Enter your Gmail account to sign in:", "user@gmail.com");
            if(email && email.includes("@")) {
                localStorage.setItem('googleUserEmail', email);
                showDashboard(email);
                alert("Successfully logged in with " + email);
            } else {
                alert("Please enter a valid Gmail address.");
            }
        }

        function showDashboard(email) {
            document.getElementById('loginSection').style.display = "none";
            document.getElementById('dashboardSection').style.display = "block";
            document.getElementById('sidebarUserEmail').innerText = email;
            let namePart = email.split('@')[0];
            document.getElementById('sidebarUserName').innerText = namePart.charAt(0).toUpperCase() + namePart.slice(1);
        }

        function handleLogout() {
            localStorage.removeItem('googleUserEmail');
            location.reload();
        }

        function saveChannelLink() {
            let val = document.getElementById('channelInputT' in window ? '' : document.getElementById('channelInput').value.trim()).trim();
            if(!val) {
                alert("Please enter a channel link!");
                return;
            }
            localStorage.setItem('savedChannelLink', val);
            document.getElementById('savedChannelDisplay').innerHTML = "<b>Saved Channel:</b> <a href='" + val + "' target='_blank' style='color: #2563eb;'>" + val + "</a>";
            document.getElementById('channelInput').value = "";
            alert("Channel saved successfully!");
        }

        function startLiveStreamSession() {
            let val = document.getElementById('videoLinkInput').value.trim();
            if(!val) {
                alert("Please enter a YouTube video link or ID!");
                return;
            }
            
            let videoId = val;
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = val.match(regExp);
            if (match && match[2].length === 11) {
                videoId = match[2];
            }

            let currentDomain = window.location.hostname || "localhost";
            
            // لائیو موड پیرامیٹرز کے ساتھ پلیئر اور چیٹ لنک
            document.getElementById('ytIframe').src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1&live=1&modestbranding=1";
            document.getElementById('ytChatIframe').src = "https://www.youtube.com/live_chat?v=" + videoId + "&embed_domain=" + currentDomain;
            
            document.getElementById('liveWrapperBox').style.display = "block";
            document.getElementById('videoLinkInput').value = "";
            alert("Live Stream & Live Chat started successfully!");
        }
    </script>
</body>
</html>
