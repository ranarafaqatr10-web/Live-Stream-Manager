<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Auto Caption & Ads Studio</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --text-main: #f8fafc;
            --accent: #6366f1;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; justify-content: space-between; align-items: center; min-height: 100vh; padding: 15px; direction: rtl; text-align: center; }

        .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 12px; }
        
        h1 { font-size: 18px; font-weight: 700; color: #fff; }
        p.sub-text { font-size: 13px; color: #94a3b8; }

        /* ویڈیو پلیئر سیکشن */
        .video-box { width: 100%; height: 200px; background: #000; border-radius: 10px; overflow: hidden; position: relative; border: 2px solid var(--border-color); display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .placeholder-text { color: #64748b; font-size: 14px; position: absolute; }

        /* ویڈیو کے اوپر چلنے والا آٹو کیپشن باکس */
        .caption-overlay { position: absolute; bottom: 15px; background: rgba(0, 0, 0, 0.75); color: #facc15; padding: 8px 15px; border-radius: 6px; font-size: 16px; font-weight: bold; max-width: 90%; word-break: break-word; border: 1px solid #eab308; }

        /* بٹنز */
        .btn { display: block; width: 100%; background: #10b981; color: white; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #059669; }

        .secondary-btn { background: #3b82f6; }
        .secondary-btn:hover { background: #2563eb; }

        #videoInput { display: none; }

        /* --- اشتہار (Ad Banner) لگانے کا سیکشن --- */
        .ad-container { width: 100%; background: #1e293b; border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); overflow: hidden; text-align: right; margin-top: 10px; }
        .ad-header { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; background: #0f172a; border-bottom: 1px solid var(--border-color); }
        .ad-badge { background: #f59e0b; color: #000; font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
        .ad-body { display: flex; gap: 10px; padding: 10px; align-items: center; }
        .ad-thumb { width: 80px; height: 55px; object-fit: cover; border-radius: 6px; background: #334155; }
        .ad-info { flex: 1; }
        .ad-title { font-size: 12px; font-weight: 700; color: #fff; margin-bottom: 2px; }
        .ad-desc { font-size: 10px; color: #94a3b8; line-height: 1.3; margin-bottom: 5px; }
        .ad-cta { background: #10b981; color: white; border: none; padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: 600; cursor: pointer; float: left; }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ AI Video Auto Caption & Emoji</h1>
        <p class="sub-text" id="statusMsg">اپنی ویڈیو اپ لوڈ کریں اور آٹو کیپشن دیکھیں</p>

        <!-- ویڈیو دکھانے اور پلے کرنے کی جگہ -->
        <div class="video-box" id="videoBox">
            <span class="placeholder-text" id="placeholderText">کوئی ویڈیو منتخب نہیں کی گئی 🎬</span>
            <video id="mainVideo" controls style="display: none;"></video>
            <div class="caption-overlay" id="captionOutput" style="display: none;">کیپشن یہاں آئیں گے...</div>
        </div>

        <!-- چھپی ہوئی فائل فیلڈ جو ویڈیو اٹھائے گی -->
        <input type="file" id="videoInput" accept="video/*" onchange="handleVideoUpload(event)">

        <!-- ویڈیو سلیکٹ کرنے کا بٹن -->
        <button class="btn" onclick="document.getElementById('videoInput').click()">📁 ویڈیو سلیکٹ کریں</button>

        <!-- لائیو بول کر کیپشن بنانے کا بٹن -->
        <button class="btn secondary-btn" onclick="startVoiceCaptioning()">🎙️ لائیو بولیں (آٹو کیپشن + ایموجی)</button>

        <!-- نیچے اشتہار (Ad Banner) - یہاں آپ اپنے اشتہار کا کوڈ یا لنک لگا سکتے ہیں -->
        <div class="ad-container">
            <div class="ad-header">
                <span style="font-size: 9px; color: #94a3b8;">Sponsored Advertisement</span>
                <span class="ad-badge">AD</span>
            </div>
            <div class="ad-body">
                <img src="https://images.unsplash.com/photo-1557804506-669a67965ba0?w=300" class="ad-thumb" alt="Ad">
                <div class="ad-info">
                    <div class="ad-title">Exclusive Offer</div>
                    <div class="ad-desc">Discover amazing products and services today.</div>
                    <button class="ad-cta" onclick="alert('اشتہار پر کلک کرنے کا شکریہ!')">Install Now</button>
                </div>
            </div>
        </div>
    </div>

<script>
    // 1. ویڈیو اپ لوڈ کرنے اور چلانے کا فنکشن
    function handleVideoUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const videoElement = document.getElementById('mainVideo');
            const placeholder = document.getElementById('placeholderText');
            const captionBox = document.getElementById('captionOutput');
            
            videoElement.src = URL.createObjectURL(file);
            videoElement.style.display = 'block';
            placeholder.style.display = 'none';
            captionBox.style.display = 'block';

            document.getElementById('statusMsg').innerText = "ویڈیو لوڈ ہو گئی! پلے کریں 👇";
            
            // فرضی خودکار کیپشن اور ایموجی ویڈیو پر دکھانا
            setTimeout(() => {
                let sampleText = "مدینہ کا سفر اور کھانا بہت مزیدار تھا!";
                captionBox.innerText = addAutoEmojis(sampleText);
            }, 1000);
        }
    }

    // 2. ٹاپک کے حساب سے خودکار ایموجی (Auto Emoji) ایڈ کرنے کا فنکشن
    function addAutoEmojis(text) {
        let modifiedText = text;
        if (text.includes("مدینہ") || text.includes("مکہ") || text.includes("مسجد")) {
            modifiedText += " 🕌 🕋";
        }
        if (text.includes("کھانا") || text.includes("بھوک") || text.includes("بریانی")) {
            modifiedText += " 🍲 😋";
        }
        if (text.includes("پیار") || text.includes("محبت") || text.includes("دل")) {
            modifiedText += " ❤️ ✨";
        }
        if (text.includes("سفر") || text.includes("کار") || text.includes("گاڑی")) {
            modifiedText += " 🚗 🛣️";
        }
        return modifiedText;
    }

    // 3. لائیو مائیک کے ذریعے بول کر کیپشن اور ایموجی لانے کا فنکشن
    function startVoiceCaptioning() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("معذرت، آپ کا براؤزر اسپیچ ریکگنیشن سپورٹ نہیں کرتا۔");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'ur-PK';
        recognition.continuous = true;
        recognition.interimResults = true;

        const captionBox = document.getElementById('captionOutput');
        captionBox.style.display = 'block';

        recognition.onstart = function() {
            document.getElementById('statusMsg').innerText = "سن رہا ہوں... بولنا شروع کریں 🎙️";
        };

        recognition.onresult = function(event) {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }
            captionBox.innerText = addAutoEmojis(transcript);
        };

        recognition.onerror = function(event) {
            alert("وائس ایرر: " + event.error);
        };

        recognition.start();
    }
</script>

</body>
</html>
