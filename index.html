here<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="google-adsense-account" content="ca-pub-3418695563807315">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream & Channel Manager</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
            --navbar-bg: linear-gradient(135deg, #4f46e5, #7c3aed);
            --sidebar-bg: #1e1b4b;
            --card-bg: #ffffff;
            --section-bg-1: #fdf4ff; /* Light Pink */
            --section-bg-2: #ecfdf5; /* Light Green */
            --section-bg-3: #eff6ff; /* Light Blue */
            --text-color: #0f172a;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            min-height: 100vh;
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--navbar-bg);
            padding: 15px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid rgba(255,255,255,0.2);
        }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #ffffff;
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        .app-title {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .balance-info {
            font-size: 13px;
            font-weight: bold;
            background: #f59e0b;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
        }

        /* Sidebar Menu */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0; /* Left side drawer for English */
            background: var(--sidebar-bg);
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            border-right: 2px solid #4f46e5;
        }

        .sidebar a, .sidebar .sidebar-content {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 15px;
            color: #e2e8f0;
            display: block;
            transition: 0.2s;
            font-weight: 600;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar a:hover {
            background-color: #4f46e5;
            color: #ffffff;
            padding-left: 30px;
        }

        .sidebar .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 20px;
            cursor: pointer;
            background: #ef4444;
            border: none;
            color: #ffffff;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-weight: bold;
        }

        .sidebar select {
            background: #334155;
            color: white;
            border: 1px solid #475569;
            padding: 8px;
            border-radius: 8px;
            width: calc(100% - 50px);
            margin: 10px 25px;
            font-size: 14px;
        }

        /* Main Container */
        .container {
            width: 90%;
            max-width: 500px;
            margin: 30px auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 3px solid #6366f1;
        }

        .section-1 {
            background: var(--section-bg-3);
            border: 2px solid #3b82f6;
        }

        .section-2 {
            background: var(--section-bg-2);
            border: 2px solid #10b981;
        }

        .section-3 {
            background: var(--section-bg-1);
            border: 2px solid #ec4899;
        }

        .section {
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #1e293b;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            background: #ffffff;
            color: #333;
            font-weight: 600;
        }

        input:focus, select:focus {
            border-color: #6366f1;
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        button.action-btn {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3);
            transition: 0.2s;
        }

        button.action-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .search-btn {
            background: linear-gradient(135deg, #2563eb, #3b82f6) !important;
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.3) !important;
        }

        .ad-btn {
            background: linear-gradient(135deg, #db2777, #f43f5e) !important;
            box-shadow: 0 6px 15px rgba(244, 63, 94, 0.35) !important;
        }

        .status-text {
            font-weight: bold;
            color: #047857;
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            background: #ffffff;
            padding: 10px;
            border-radius: 10px;
            border: 2px dashed #10b981;
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <div class="navbar">
        <button class="menu-icon" onclick="toggleMenu()">☰</button>
        <h1 class="app-title">Live Stream Manager</h1>
        <div class="balance-info">🪙 <span id="navCoins">0</span> Coins</div>
    </div>

    <!-- Sidebar Menu with Language Selector -->
    <div id="mySidebar" class="sidebar">
        <button class="close-btn" onclick="toggleMenu()">✕</button>
        <div style="text-align: center; padding: 25px 15px; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <h3 style="margin: 0; color: #ffffff;" id="menuUserName">Guest User</h3>
            <p style="margin: 8px 0 0 0; font-size: 12px; color: #94a3b8;">Online Account</p>
        </div>
        
        <!-- Language Selector inside Three Lines Menu -->
        <div style="padding: 10px 0;">
            <label style="color: #cbd5e1; font-size: 13px; padding: 0 25px;">Select Language:</label>
            <select id="langSelect" onchange="changeLanguage()">
                <option value="en">English</option>
                <option value="ur">اردو (Urdu)</option>
                <option value="hi">हिन्दी (Hindi)</option>
            </select>
        </div>

        <a href="#" onclick="loginWithGoogle()">🔐 Login with Google</a>
        <a href="#" onclick="logoutUser()">🚪 Logout</a>
        <a href="#" onclick="alert('Your Total Coins: ' + (localStorage.getItem('userCoins') || 0))">💰 Check Balance</a>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Channel Search Section -->
        <div class="section section-1">
            <label>🔍 Search Your Channel</label>
            <select id="platformSelect">
                <option value="youtube">YouTube</option>
                <option value="tiktok">TikTok</option>
            </select>
            <input type="text" id="channelInput" placeholder="Enter channel name or profile link">
            <button class="action-btn search-btn" onclick="searchChannel()">Search Channel</button>
        </div>

        <!-- Coins & Payment Section -->
        <div class="section section-2">
            <label>💳 Get Coins (Payment Verification)</label>
            <select id="paymentSelect">
                <option value="easypaisa">EasyPaisa</option>
                <option value="jazzcash">JazzCash</option>
                <option value="meezan">Meezan Bank</option>
            </select>
            <input type="text" id="tidInput" placeholder="Enter Transaction ID (TID) or Number">
            <button class="action-btn" onclick="submitPayment()">Pay 100 PKR (Get 50 Coins)</button>
        </div>

        <!-- Free Live Stream Time Section -->
        <div class="section section-3">
            <label>⏱️ Free Live Stream Time</label>
            <p style="font-size: 12px; color: #475569; margin-top: 0; margin-bottom: 12px; font-weight: 600;">Watch ads to earn free minutes:</p>
            <button class="action-btn ad-btn" onclick="watchAd()">Watch 30s Ad</button>
            <div class="status-text" id="statusDisplay">Watched Ads: 0 | Free Time: 0 mins</div>
        </div>
    </div>

    <script>
        function toggleMenu() {
            let sidebar = document.getElementById("mySidebar");
            if (sidebar.style.width === "280px") {
                sidebar.style.width = "0";
            } else {
                sidebar.style.width = "280px";
            }
        }

        window.onload = function() {
            refreshData();
        };

        function refreshData() {
            let savedAds = localStorage.getItem('watchedAds') || 0;
            let savedMinutes = localStorage.getItem('freeMinutes') || 0;
            let savedCoins = localStorage.getItem('userCoins') || 0;
            let savedUser = localStorage.getItem('userName');

            document.getElementById('navCoins').innerText = savedCoins;
            document.getElementById('statusDisplay').innerText = "Watched Ads: " + savedAds + " | Free Time: " + savedMinutes + " mins";

            if(savedUser) {
                document.getElementById('menuUserName').innerText = savedUser;
            }
        }

        function loginWithGoogle() {
            let name = prompt("Enter your name or Gmail:");
            if(name && name.trim() !== "") {
                localStorage.setItem('userName', name);
                refreshData();
                alert("Successfully logged in!");
                toggleMenu();
            }
        }

        function logoutUser() {
            localStorage.removeItem('userName');
            document.getElementById('menuUserName').innerText = "Guest User";
            refreshData();
            alert("Logged out successfully!");
            toggleMenu();
        }

        function searchChannel() {
            let val = document.getElementById('channelInput').value;
            if(val.trim() === "") {
                alert("Please enter a channel name or link!");
            } else {
                alert("Searching channel information for: " + val);
            }
        }

        function submitPayment() {
            let tid = document.getElementById('tidInput').value;
            if(tid.trim() === "") {
                alert("Please enter Transaction ID (TID) or number!");
                return;
            }

            let currentCoins = parseInt(localStorage.getItem('userCoins') || 0);
            currentCoins += 50;
            localStorage.setItem('userCoins', currentCoins);

            refreshData();
            alert("Payment received! 50 coins added to your account.");
            document.getElementById('tidInput').value = "";
        }

        function watchAd() {
            let ads = parseInt(localStorage.getItem('watchedAds') || 0);
            let minutes = parseInt(localStorage.getItem('freeMinutes') || 0);

            ads += 1;
            minutes += 15;

            localStorage.setItem('watchedAds', ads);
            localStorage.setItem('freeMinutes', minutes);

            refreshData();
            alert("Ad completed! You earned 15 minutes of free stream time.");
        }

        function changeLanguage() {
            let lang = document.getElementById('langSelect').value;
            if(lang === 'ur') {
                alert("Language changed to Urdu (Feature preview)");
            } else if(lang === 'hi') {
                alert("Language changed to Hindi (Feature preview)");
            } else {
                alert("Language set to English");
            }
            toggleMenu();
        }
    </script>
</body>
</html>
