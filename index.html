<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Pro - AI Studio & Creator Suite</title>
    <style>
        :root {
            --bg-main: #131314;
            --bg-card: #1e1f20;
            --bg-input: #282a2c;
            --border-color: #333537;
            --accent-blue: #8ab4f8;
            --text-main: #e3e3e3;
            --text-muted: #c4c7c5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; direction: rtl; text-align: right; }

        /* Top Header */
        .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--bg-main); border-bottom: 1px solid var(--border-color); }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .menu-btn { background: none; border: none; color: var(--text-main); font-size: 22px; cursor: pointer; padding: 5px; border-radius: 50%; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; }
        .menu-btn:hover { background: var(--bg-card); }
        .logo-title { font-size: 18px; font-weight: 600; color: var(--text-main); }

        /* Sidebar Drawer */
        .sidebar { position: fixed; top: 0; right: -300px; width: 280px; height: 100%; background: var(--bg-card); border-left: 1px solid var(--border-color); z-index: 1000; transition: 0.3s ease; display: flex; flex-direction: column; padding: 20px; }
        .sidebar.open { right: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-sidebar { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }
        .sidebar-menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: var(--text-main); text-decoration: none; border-radius: 25px; font-size: 14px; margin-bottom: 5px; transition: 0.2s; }
        .sidebar-menu-item:hover { background: var(--bg-input); }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 999; }
        .overlay.show { display: block; }

        /* Main Workspace Container */
        .main-content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; max-width: 850px; width: 100%; margin: 0 auto; }
        
        .welcome-box { text-align: center; margin-top: 20px; }
        .welcome-box h1 { font-size: 28px; background: linear-gradient(135deg, #9bbcf2, #c58af9, #f28b82); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; margin-bottom: 5px; }
        .welcome-box p { color: var(--text-muted); font-size: 14px; }

        /* Output Cards */
        .result-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 20px; border-radius: 16px; margin-top: 15px; }
        .result-card h3 { color: var(--accent-blue); font-size: 16px; margin-bottom: 10px; font-weight: 600; }
        .result-card p { background: var(--bg-main); padding: 12px; border-radius: 8px; color: #cbd5e1; font-size: 14px; line-height: 1.6; border: 1px solid var(--border-color); word-break: break-word; }
        
        .thumbnail-container { text-align: center; margin-top: 10px; }
        #thumbCanvas { width: 100%; max-width: 100%; height: auto; border-radius: 10px; border: 2px solid var(--accent-blue); background: #000; }

        /* Input Area (Gemini Style Bottom Bar) */
        .input-area-wrapper { padding: 15px 20px; background: var(--bg-main); display: flex; justify-content: center; position: relative; }
        .input-box { max-width: 850px; width: 100%; background: var(--bg-input); border-radius: 28px; padding: 8px 15px; display: flex; align-items: center; gap: 10px; border: 1px solid transparent; transition: 0.2s; }
        .input-box:focus-within { border-color: var(--accent-blue); background: #2d3033; }

        .action-icon-btn { background: none; border: none; color: var(--text-muted); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: 0.2s; }
        .action-icon-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-main); }

        .chat-input-field { flex: 1; background: none; border: none; color: var(--text-main); font-size: 15px; outline: none; padding: 8px; direction: rtl; }
        .chat-input-field::placeholder { color: var(--text-muted); }

        /* Plus Menu Popup */
        .plus-popup { position: absolute; bottom: 80px; right: 40px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 8px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 100; min-width: 230px; }
        .plus-popup.show { display: block; }
        .plus-option { padding: 12px 16px; font-size: 14px; color: var(--text-main); cursor: pointer; border-radius: 8px; display: flex; gap: 12px; align-items: center; transition: 0.2s; }
        .plus-option:hover { background: var(--bg-input); color: var(--accent-blue); }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3 style="color:var(--text-main)">Gemini Menu</h3>
            <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
        </div>
        <a href="#" class="sidebar-menu-item" onclick="resetStudio()">➕ New chat</a>
        <a href="#" class="sidebar-menu-item" onclick="alert('سرچ فیچر ایکٹیو ہے')">🔍 Search chats</a>
        <a href="#" class="sidebar-menu-item" onclick="alert('لائبریری اور گیلری')">🖼️ Library & Media</a>
    </div>

    <div class="header">
        <div class="header-left">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <span class="logo-title">Gemini AI Studio</span>
        </div>
    </div>

    <div class="main-content" id="mainContent">
        <div class="welcome-box" id="welcomeBox">
            <h1>ہیلو! میں آپ کا اے آئی اسسٹنٹ ہوں۔</h1>
            <p>نیچے پلس (+) کے بٹن سے میڈیا جوڑیں یا کوئی بھی ٹاپک لکھ کر اسٹوڈیو ٹولز چلائیں۔</p>
        </div>
    </div>

    <div class="input-area-wrapper">
        <div class="plus-popup" id="plusPopup">
            <div class="plus-option" onclick="selectOption('Photos & Media')">🖼️ Photos & Media</div>
            <div class="plus-option" onclick="selectOption('Music & Audio')">🎵 Music & Audio</div>
            <div class="plus-option" onclick="selectOption('Canvas Studio')">🎨 Canvas Studio</div>
            <div class="plus-option" onclick="selectOption('Guided Learning')">📖 Guided Learning</div>
            <div class="plus-option" onclick="selectOption('Personalised Chat')">💬 Personalised Chat</div>
        </div>

        <div class="input-box">
            <button class="action-icon-btn" onclick="togglePlusMenu()" title="مزید آپشنز (+)">➕</button>
            <input type="text" class="chat-input-field" id="userInput" placeholder="ٹاپک لکھیں یا Gemini سے پوچھیں..." onkeypress="handlePress(event)">
            <button class="action-icon-btn" onclick="startVoice()" title="وائس ان پٹ">🎤</button>
            <button class="action-icon-btn" onclick="processStudio()" title="جنریٹ کریں">➤</button>
        </div>
    </div>

<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('show');
    }

    function togglePlusMenu() {
        document.getElementById('plusPopup').classList.toggle('show');
    }

    function selectOption(featureName) {
        togglePlusMenu();
        userInput.value = featureName + ": ";
        userInput.focus();
    }

    function resetStudio() {
        document.getElementById('mainContent').innerHTML = `
            <div class="welcome-box" id="welcomeBox">
                <h1>ہیلو! میں آپ کا اے آئی اسسٹنٹ ہوں۔</h1>
                <p>نیچے پلس (+) کے بٹن سے میڈیا جوڑیں یا کوئی بھی ٹاپک لکھ کر اسٹوڈیو ٹولز چلائیں۔</p>
            </div>
        `;
        toggleSidebar();
    }

    function processStudio() {
        const text = userInput.value.trim();
        if(!text) {
            alert("براہ کرم کوئی ٹاپک یا پراम्प्ट درج کریں!");
            return;
        }

        const welcome = document.getElementById('welcomeBox');
        if(welcome) welcome.remove();

        const container = document.getElementById('mainContent');

        // Add User Input Card
        const userCard = document.createElement('div');
        userCard.className = 'result-card';
        userCard.innerHTML = `<h3>👤 آپ کا حکم / ٹاپک:</h3><p>${text}</p>`;
        container.appendChild(userCard);

        // Add AI Generated Studio Package Card
        const aiCard = document.createElement('div');
        aiCard.className = 'result-card';
        aiCard.innerHTML = `
            <h3>✨ اے آئی اسٹوڈیو کا تیار کردہ رزلٹ:</h3>
            <p><strong>📌 وائرل ٹائتل:</strong> ${text} | ماسٹر کلاس گائیڈ 2026</p>
            <p><strong>📝 ایس ای او ڈسکرپشن:</strong> اس سیشن میں ہم '${text}' پر تفصیلی بات چیت کر رہے ہیں۔ تمام اہم پوائنٹس اس میں شامل کر دیے گئے ہیں۔</p>
            
            <div class="thumbnail-container">
                <canvas id="dynamicCanvas" width="1280" height="720"></canvas>
            </div>
        `;
        container.appendChild(aiCard);
        container.scrollTop = container.scrollHeight;

        // Render Canvas Thumbnail instantly
        const canvas = document.getElementById('dynamicCanvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 1280, 720);

        let grad = ctx.createLinearGradient(0, 0, 1280, 720);
        grad.addColorStop(0, '#0f172a');
        grad.addColorStop(1, '#3b82f6');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1280, 720);

        ctx.strokeStyle = '#8ab4f8';
        ctx.lineWidth = 10;
        ctx.strokeRect(60, 60, 1160, 600);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 55px sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 20;
        ctx.fillText(text, 640, 320);

        ctx.fillStyle = '#8ab4f8';
        ctx.font = 'bold 30px sans-serif';
        ctx.fillText("🔥 [ GEMINI PRO STUDIO ] 🔥", 640, 500);

        userInput.value = '';
    }

    function handlePress(e) {
        if(e.key === 'Enter') {
            processStudio();
        }
    }

    function startVoice() {
        try {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechRecognition) {
                alert("براؤزر وائस ریکگنیشن سپورٹ نہیں کرتا۔");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'ur-PK';
            recognition.start();

            recognition.onresult = function(e) {
                userInput.value = e.results[0][0].transcript;
                processStudio();
            }
        } catch(err) {
            alert("مائیکروفون میں مسئلہ ہے۔");
        }
    }
</script>

</body>
</html>
