<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Auto Caption & Auto Emoji Studio</title>
    <style>
        :root {
            --bg-main: #ffffff;
            --text-main: #111827;
            --accent: #6366f1;
            --border-color: #e5e7eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; justify-content: space-between; align-items: center; height: 100vh; padding: 20px 15px; direction: rtl; text-align: center; overflow: hidden; }

        .top-section { width: 100%; max-width: 450px; margin-top: 10px; }
        h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #111; }
        p.sub-text { font-size: 14px; color: #4b5563; margin-bottom: 12px; }

        /* آٹو کیپشن اور ایموجی شو ہونے والا باکس */
        .caption-preview-box { background: #111827; color: #facc15; padding: 15px; border-radius: 10px; font-size: 19px; font-weight: bold; min-height: 75px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; word-break: break-word; border: 2px solid #eab308; }

        .btn { display: block; width: 100%; background: #10b981; color: white; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        .btn:hover { background: #059669; }

        .cancel-btn { background: none; border: none; color: #1e3a8a; font-size: 15px; font-weight: 600; cursor: pointer; padding: 5px; }
        .cancel-btn:hover { text-decoration: underline; }

        #videoFile { display: none; }

        /* نیچے اشتہار (Ad Banner) کا ڈیزائن */
        .ad-container { width: 100%; max-width: 450px; background: #ffffff; border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 5px; text-align: right; }
        .ad-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #f9fafb; border-bottom: 1px solid var(--border-color); }
        .ad-badge { background: #3b82f6; color: white; font-size: 9px; font-weight: bold; padding: 2px 5px; border-radius: 4px; }
        .ad-body { display: flex; gap: 10px; padding: 10px; align-items: center; }
        .ad-thumb { width: 90px; height: 60px; object-fit: cover; border-radius: 6px; background: #ccc; }
        .ad-info { flex: 1; }
        .ad-title { font-size: 13px; font-weight: 700; color: #111; margin-bottom: 2px; }
        .ad-desc { font-size: 11px; color: #6b7280; line-height: 1.3; margin-bottom: 6px; }
        .ad-cta { background: #1f2937; color: white; border: none; padding: 5px 12px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; float: left; }
    </style>
</head>
<body>

    <input type="file" id="videoFile" accept="video/*" onchange="startProcessing()">

    <div class="top-section">
        <h1>✨ AI Auto Caption & Auto Emojis</h1>
        <p class="sub-text" id="statusText">بولیں اور خودکار الفاظ کے ساتھ ایموجیز پائیں</p>
        
        <div class="caption-preview-box" id="captionOutput">
            کیپشن اور ایموجی یہاں ظاہر ہوں گے... 🎬
        </div>

        <button class="btn" onclick="startVoiceCaptions()">🎙️ لائیو بولیں (آٹو کیپشن + آٹو ایموجی)</button>
        <button class="cancel-btn" onclick="triggerUpload()">📁 ویڈیو سلیکٹ کریں</button>
    </div>

    <!-- نیچے چلنے والا اشتہار (Ad Section) -->
    <div class="ad-container">
        <div class="ad-header">
            <span style="font-size: 10px; color: #9ca3af;">Sponsored Ad</span>
            <span class="ad-badge">Ad</span>
        </div>
        <div class="ad-body">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300" class="ad-thumb" alt="Ad">
            <div class="ad-info">
                <div class="ad-title">Pakistan in Motion</div>
                <div class="ad-desc">Explore the new collection today.</div>
                <button class="ad-cta" onclick="alert('Ad clicked!')">More</button>
            </div>
        </div>
    </div>

<script>
    function triggerUpload() {
        document.getElementById('videoFile').click();
    }

    function startProcessing() {
        const fileInput = document.getElementById('videoFile');
        if (fileInput.files.length > 0) {
            document.getElementById('statusText').innerText = "پراسیسنگ جاری ہے...";
            setTimeout(() => {
                let sampleText = "مدینہ اور کھانا بہت شاندار ہے!";
                document.getElementById('captionOutput').innerText = addAutoEmojis(sampleText);
                document.getElementById('statusText').innerText = "مکمل ہو گیا! ✅";
            }, 1500);
        }
    }

    /* --- ٹاپک کے حساب سے آٹو ایموجی لگانے والا خاص فنکشن --- */
    function addAutoEmojis(text) {
        let modifiedText = text;
        
        if (text.includes("مدینہ") || text.includes("مکہ") || text.includes("مسجد") || text.includes("نبی")) {
            modifiedText += " 🕌 🕋";
        }
        if (text.includes("کھانا") || text.includes("بھوک") || text.includes("بریانی") || text.includes("روٹی")) {
            modifiedText += " 🍲 😋";
        }
        if (text.includes("پیار") || text.includes("محبت") || text.includes("دل")) {
            modifiedText += " ❤️ ✨";
        }
        if (text.includes("پانی") || text.includes("پیاس")) {
            modifiedText += " 💧 🥤";
        }
        if (text.includes("کار") || text.includes("گاڑی") || text.includes("سفر")) {
            modifiedText += " 🚗 🛣️";
        }
        if (text.includes("سلام") || text.includes("اللّه") || text.includes("خدا")) {
            modifiedText += " ✨ 🤲";
        }
        
        return modifiedText;
    }

    /* --- لائیو وائس اسپیچ اور آٹو ایموجی کا سسٹم --- */
    function startVoiceCaptions() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("معذرت، آپ کا براؤزر اسپیچ ریکگنیشن سپورٹ نہیں کرتا۔");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'ur-PK'; // اردو زبان
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = function() {
            document.getElementById('captionOutput').innerText = "سن رہا ہوں... بولنا شروع کریں 🎙️";
        };

        recognition.onresult = function(event) {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }
            // بولے گئے جملے پر خودکار ایموجی لگانا
            let finalWithEmojis = addAutoEmojis(transcript);
            document.getElementById('captionOutput').innerText = finalWithEmojis;
        };

        recognition.onerror = function(event) {
            alert("وائस ان پٹ میں خرابی پیش آئی: " + event.error);
        };

        recognition.start();
    }
</script>

</body>
</html>
